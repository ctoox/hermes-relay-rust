[package]
name = "hermes-relay"
version = "1.0.0"
edition = "2021"
description = "Hermes Relay - High-performance remote control system via Feishu"
authors = ["Hermes Team"]
license = "MIT"

[[bin]]
name = "hermes-relay-server"
path = "src/bin/server.rs"

[[bin]]
name = "hermes-relay-agent"
path = "src/bin/agent.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# WebSocket
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
tungstenite = "0.21"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP client (for Feishu API)
reqwest = { version = "0.11", features = ["json", "native-tls"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
anyhow = "1"
thiserror = "1"

# Configuration
toml = "0.8"

# UUID generation
uuid = { version = "1", features = ["v4"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Regex
regex = "1"

# Hashing and crypto
sha2 = "0.10"
hmac = "0.12"
base64 = "0.21"

# System info (for agent)
sysinfo = "0.29"

# Signal handling
ctrlc = "3"

# Command execution
which = "5"

# Dashmap for concurrent HashMap
dashmap = "5"

# Futures
futures = "0.3"

# URL parsing
url = "2"

# Rand
rand = "0.8"

# CLI
clap = { version = "4", features = ["derive"] }

# Hostname
hostname = "0.3"

[dev-dependencies]
tokio-test = "0.4"
